<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匠丸達人 - 扭蛋登記</title>
    <link rel="stylesheet" href="style.css"> <!-- 引用 style.css -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <!-- <script src="firebase.js" type="module"></script> -->
</head>
<body>
    <h1>匠丸達人 - 扭蛋登記</h1>
    <h5>v2.2.0</h5>

    <hr class="mt-0 mb-4">

    <div class="container justify-content-center">
        <div class="row mb-4 justify-content-center">
            <div class="col-3">
                <label for="codeInput" class="col-form-label">編號：</label>
            </div>
            <div class="col-9">
                <input type="tel" class="form-control" id="codeInput">
            </div>
            <div class="row mt-1">
                <button type="button" class="btn btn-outline-primary col-5 mt-1 m-auto prefixBtn" data-prefix="C010"> C010 </button>
                <button type="button" class="btn btn-outline-primary col-5 mt-1 m-auto prefixBtn" data-prefix="C011"> C011 </button>
                <button type="button" class="btn btn-outline-primary col-5 mt-1 m-auto prefixBtn" data-prefix="H001-0000"> H001-0000 </button>
                <button type="button" class="btn btn-outline-primary col-5 mt-1 m-auto prefixBtn" data-prefix="H001-0000"> H002-0000 </button>
                <button type="button" class="btn btn-outline-primary col-5 mt-1 m-auto prefixBtn" data-prefix="F002-0000"> F002-0000 </button>
                <button type="button" class="btn btn-outline-primary col-5 mt-1 m-auto prefixBtn" data-prefix="F002-0000"> F016-0000 </button>
            </div>
        </div>

        <div class="row mb-4 justify-content-center">
            <div class="col-3">
                <label for="priceInput" class="col-form-label">價格：</label>
            </div>
            <div class="col-9">
                <input type="tel" class="form-control" id="priceInput">
            </div>
            <div class="row mt-1">
                <button type="button" class="btn btn-outline-success col-2 mt-1 m-auto priceBtn" data-price="50"> 50 </button>
                <button type="button" class="btn btn-outline-success col-2 mt-1 m-auto priceBtn" data-price="60"> 60 </button>
                <button type="button" class="btn btn-outline-success col-2 mt-1 m-auto priceBtn" data-price="100"> 100 </button>
                <button type="button" class="btn btn-outline-success col-2 mt-1 m-auto priceBtn" data-price="120"> 120 </button>
                <button type="button" class="btn btn-outline-success col-2 mt-1 m-auto priceBtn" data-price="150"> 150 </button>
            </div>
        </div>

        <div class="row mb-4 justify-content-center">
            <div class="col-3">
                <label for="quantityInput" class="col-form-label">數量：</label>
            </div>
            <div class="col-9">
                <input type="tel" class="form-control" id="quantityInput">
            </div>
            <div class="row mt-1">
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="1"> 1 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="2"> 2 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="3"> 3 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="4"> 4 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="5"> 5 </button>
            </div>
            <div class="row mt-1">
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="6"> 6 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="7"> 7 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="8"> 8 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="9"> 9 </button>
                <button type="button" class="btn btn-outline-dark col-2 m-1 m-auto quantityBtn" data-quantity="10"> 10 </button>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-3">
                <label for="checkoutDate" class="col-form-label">日期：</label>
            </div>
            <div class="col-9">
                <input type="tel" class="form-control" id="checkoutDate">
            </div>
        </div>
        
        <div class="row p-1">
            <button type="button" class="btn btn-primary" id="submitBtn"> 送出 </button>
        </div>

        <div id="alertPlaceholder" class="w-100 p-1"></div>
    </div>
    
    <hr class="mt-4 mb-4">

    <!-- 表格顯示條碼資訊 -->
    <table id="barcodeTable">
        <thead>
            <tr>
                <th>商品條碼</th>
                <th>價格</th>
                <th>數量</th>
                <th>小記</th>
                <th>新條碼</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- 條碼資料會在這裡新增 -->
        </tbody>
        <tfoot>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td id="totalCell"></td>
                <td></td>
                <td></td>
            </tr>
        </tfoot>
    </table>

    <script src="script.js" type="module"></script>
    <!-- <script src="script.js" type="text/javascript"></script> -->
</body>
</html>
