<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匠丸達人 - 扭蛋登記</title>
    <link rel="stylesheet" href="style.css"> <!-- 引用 style.css -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>

    <!-- <script src="firebase.js" type="module"></script> -->
</head>
<body>
    <h1>匠丸達人 - 扭蛋登記</h1>
    <h5>v2.1.0</h5>

    <div id="inputDiv">
        <label>
            條碼：
            <input id="codeInput" type="tel" />
        </label>
        <div class="codePrefixBtnDiv">
            <button type="button" class="codePrefixBtn" data-prefix="C01"> C010 </button>
            <button type="button" class="codePrefixBtn" data-prefix="C01"> C011 </button>
        </div>
        <div class="codePrefixBtnDiv">
            <button type="button" class="codePrefixBtn" data-prefix="H001-0000"> H001-0000 </button>
            <button type="button" class="codePrefixBtn" data-prefix="H001-0000"> H002-0000 </button>
        </div>
        <div class="codePrefixBtnDiv">
            <button type="button" class="codePrefixBtn" data-prefix="F002-0000"> F002-0000 </button>
            <button type="button" class="codePrefixBtn" data-prefix="F002-0000"> F016-0000 </button>
        </div>

        <label style="margin-top: 20px;">
            價格：
            <input id="priceInput" type="tel" />
        </label>
        <div class="priceBtnDiv">
            <button type="button" class="priceBtn" data-price="50"> 50 </button>
            <button type="button" class="priceBtn" data-price="60"> 60 </button>
            <button type="button" class="priceBtn" data-price="100"> 100 </button>
            <button type="button" class="priceBtn" data-price="120"> 120 </button>
            <button type="button" class="priceBtn" data-price="150"> 150 </button>
        </div>

        <label style="margin-top: 20px;">
            數量：
            <input id="quantityInput" type="tel" />
        </label>
        
        <div style="text-align: center;">
            <label for="checkout_date">日期:</label>
            <input type="date" id="checkout_date" name="checkout_date">
        </div>
        
        <button type="button" id="submitBtn">送出</button>
    </div>
        
    <!-- 表格顯示條碼資訊 -->
    <table id="barcode_table">
        <thead>
            <tr>
                <th>商品條碼</th>
                <th>價格</th>
                <th>數量</th>
                <th>小記</th>
                <th>新條碼</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- 條碼資料會在這裡新增 -->
        </tbody>
        <tfoot>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td id="total-cell"></td>
                <td></td>
                <td></td>
            </tr>
        </tfoot>
    </table>

    <script src="script.js" type="module"></script>
    <!-- <script src="script.js" type="text/javascript"></script> -->
</body>
</html>
